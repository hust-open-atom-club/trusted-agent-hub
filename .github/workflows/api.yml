name: API

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "scanners/**"
      - "benchmarks/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/api.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "scanners/**"
      - "benchmarks/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trusted_agent_hub
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trusted_agent_hub
      # Integration tests opt in through TEST_DATABASE_URL only; conftest
      # blanks DATABASE_URL/POSTGRES_* so dev/prod config can never leak in.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trusted_agent_hub
      JWT_SECRET: ci-only-refresh-token-maintenance-secret
      PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      REFRESH_TOKEN_CLEANUP_INTERVAL_SECONDS: "60"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/packages
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test database-maintenance script
        working-directory: ${{ github.workspace }}
        run: sh deploy/tests/test_cleanup_refresh_tokens.sh
      - name: Validate Compose and start PostgreSQL
        working-directory: ${{ github.workspace }}
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 60 db
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -U pip setuptools wheel build
          pip install -e ".[dev]" jsonschema psycopg2-binary numpy
      - name: Render offline migration SQL
        run: alembic upgrade head --sql > "$RUNNER_TEMP/alembic-head.sql"
      - name: Start refresh-token maintenance before migrations
        working-directory: ${{ github.workspace }}
        run: docker compose up -d db-maintenance
      - name: Verify maintenance waits for the schema
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..15}; do
            if docker compose logs --no-color db-maintenance 2>&1 | grep -Fq "readiness attempt 1/12 failed"; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color db-maintenance
          echo "db-maintenance did not report the missing refresh_tokens table." >&2
          exit 1
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run full test suite
        run: pytest tests/ -q
      - name: Run scanner benchmark regression check
        run: |
          python ../../benchmarks/runner.py --config ../../benchmarks/labels-v2.json --check --output "$RUNNER_TEMP/benchmark-1.json"
          python ../../benchmarks/runner.py --config ../../benchmarks/labels-v2.json --check --output "$RUNNER_TEMP/benchmark-2.json"
          python -c "import json, os, pathlib; a=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'benchmark-1.json').read_text()); b=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'benchmark-2.json').read_text()); assert a.get('security_fingerprint') == b.get('security_fingerprint'), f'security fingerprint mismatch: {a.get(\"security_fingerprint\")} != {b.get(\"security_fingerprint\")}'"
      - name: Verify periodic refresh-token cleanup
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..70}; do
            cleanup_runs=$(docker compose logs --no-color db-maintenance 2>&1 | grep -c "DELETE " || true)
            if [ "$cleanup_runs" -ge 2 ]; then
              docker compose ps
              docker compose logs --no-color db-maintenance
              docker compose ps --status running --services | grep -Fxq db-maintenance
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs --no-color db-maintenance
          echo "db-maintenance did not complete two cleanup cycles." >&2
          exit 1
      - name: Stop Compose services
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose down --volumes --remove-orphans
