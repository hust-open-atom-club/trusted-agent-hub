name: API

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "scanners/**"
      - ".github/workflows/api.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "scanners/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trusted_agent_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trusted_agent_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trusted_agent_hub
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/packages
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -U pip setuptools wheel build
          pip install -e ".[dev]" jsonschema psycopg2-binary numpy
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run full test suite
        run: pytest tests/ -q
