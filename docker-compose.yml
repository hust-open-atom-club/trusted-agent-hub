# TrustedAgentHub — Docker Compose 编排
# 启动：docker compose up -d
# 停止：docker compose down
# 重建：docker compose up -d --build

name: tah-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trusted_agent_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trusted_agent_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      args:
        # 语义模型开关: 用 deploy/build.ps1 交互选择, 或设环境变量 ENABLE_SEMANTIC_MODEL=true
        ENABLE_SEMANTIC_MODEL: ${ENABLE_SEMANTIC_MODEL:-false}
    restart: unless-stopped
    volumes:
      - ./examples:/examples:ro
      - artifacts:/artifacts
      - source_snapshots:/source-snapshots
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/trusted_agent_hub
      ARTIFACTS_ROOT: /artifacts
      SOURCE_SNAPSHOT_DIR: /source-snapshots
      CONSUMER_ALLOW_INSECURE_USER_HEADER: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  artifacts:
  source_snapshots:
